server:
  extraArgs:
  - --insecure

  service:
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: "nginx"

    annotations:
      nginx.org/hsts: "false"
      cert-manager.io/cluster-issuer: issuer
      nginx.org/grpc-services: argocd-server

    hostname: argocd.gatus.ibrahimali.co.uk

    extraTls:
    - secretName: argocd-ingress-tls
      hosts:
        - argocd.gatus.ibrahimali.co.uk