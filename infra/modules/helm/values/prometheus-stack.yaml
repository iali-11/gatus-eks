# Grafana Configuration

grafana:
  enabled: true

  adminUser: admin

  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      cert-manager.io/cluster-issuer: issuer

    hosts:
      - grafana.gatus.ibrahimali.co.uk

    tls:
    - hosts:
        - grafana.gatus.ibrahimali.co.uk
      secretName: grafana-ingress-tls

  persistence:
    enabled: true
    type: sts
    storageClassName: gp2
    accessModes:
      - ReadWriteOnce
    size: 8Gi

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  service:
    type: ClusterIP

  grafana.ini:
    server:
      root_url: https://grafana.gatus.ibrahimali.co.uk

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: custom
          orgId: 1
          folder: Custom
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/custom

  dashboards:
    custom:
      nginx-ingress:
        gnetId: 9614
        revision: 1
        datasource: Prometheus

# Prometheus Configuration

prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

prometheus-pushgateway:
  enabled: false