apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: gatus-db
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: gatus/db
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: gatus/db
        property: password