apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: gatus-db
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: arn:aws:secretsmanager:eu-west-2:050288151438:secret:rds!db-e6185b69-2878-4200-8edf-d1f4fbc514c8-cnnqGW
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:eu-west-2:050288151438:secret:rds!db-e6185b69-2878-4200-8edf-d1f4fbc514c8-cnnqGW
        property: password