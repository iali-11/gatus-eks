apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: gatus-db
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: arn:aws:secretsmanager:eu-west-2:050288151438:secret:rds!db-24e9340b-5416-4676-ac21-c0b8aa2e43b6-TSXIyO
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:eu-west-2:050288151438:secret:rds!db-24e9340b-5416-4676-ac21-c0b8aa2e43b6-TSXIyO
        property: password