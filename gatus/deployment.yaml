apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus-deployment
  labels:
    app: gatus
  annotations:
    reloader.stakater.com/auto: "true"

spec:
  replicas: 2
  selector:
    matchLabels:
      app: gatus

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: gatus

    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - gatus
              topologyKey: kubernetes.io/hostname

      containers:
      - name: gatus
        image: 050288151438.dkr.ecr.eu-west-2.amazonaws.com/gatus:be4705d87caaadc1ba6fd12d09c70bf2cc99e726
        imagePullPolicy: Always
        ports:
        - containerPort: 8080

        envFrom:
          - secretRef:
              name: gatus-db

        env:
          - name: GATUS_CONFIG_PATH
            value: /config/config.yaml
          - name: DB_HOST
            value: gatus-eks-postgres.cpek2ikksmbo.eu-west-2.rds.amazonaws.com
          - name: DB_NAME
            value: gatus

        volumeMounts:
          - name: gatus-config
            mountPath: /config

      volumes:
        - name: gatus-config
          configMap:
            name: gatus-config